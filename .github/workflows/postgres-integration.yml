name: PostgreSQL integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  relay-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pagent_test
          POSTGRES_USER: pagent
          POSTGRES_PASSWORD: pagent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pagent -d pagent_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relay/package-lock.json

      - name: Install relay dependencies
        run: npm ci --prefix relay

      - name: Test PostgreSQL store
        run: npm --prefix relay run test:postgres
        env:
          PAGENT_TEST_DATABASE_URL: postgresql://pagent:pagent@127.0.0.1:5432/pagent_test
